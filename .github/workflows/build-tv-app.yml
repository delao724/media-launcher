name: Build TV app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-tv-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tv-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: android/build.sh "${{ github.run_number }}"

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: tv.apk

      - name: Publish tv.apk next to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tv.apk
          git commit -m "Build TV app ${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
